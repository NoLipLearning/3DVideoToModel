[project]
name = "v2m"
version = "0.1.0"
description = "Video-to-3D-model pipeline: reconstructs manifold, watertight, print-ready meshes from video."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-contrib-python>=4.9",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "psutil>=5.9",
    "trimesh>=4.2",
    "manifold3d>=2.5",
    "open3d>=0.18",
    "pycolmap>=0.6",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "pillow>=10.2",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# pymeshlab is the heaviest, least portable dependency in the stack (see
# docs/ARCHITECTURE.md Section 2). Every call site must guard the import
# and fall back to open3d/trimesh -- it is never required for the
# pipeline to run.
mesh = ["pymeshlab>=2023.12"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "av>=12.0",
]

[project.scripts]
v2m = "v2m.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v2m"]

[tool.uv]
default-groups = ["dev"]

# Torch resolves from the default index (standard PyPI). On macOS -- the
# target platform -- this is unambiguously correct: there is no CUDA
# split on Mac at all, and PyPI's mac wheels are CPU/MPS-capable.
#
# On Linux/Windows, PyPI's default torch build bundles CUDA (multiple GB
# of unused nvidia-* packages on a machine with no GPU). The clean fix is
# a platform-conditional `tool.uv.sources` entry pointing non-Darwin at
# https://download.pytorch.org/whl/cpu -- but that host is blocked by
# some sandboxed/CI network policies (it was, in this project's own dev
# environment), so it is not forced here. If you're on Linux/Windows and
# want the lean CPU-only build, add locally:
#   [tool.uv.sources]
#   torch = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]
#   torchvision = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]
#   [[tool.uv.index]]
#   name = "pytorch-cpu"
#   url = "https://download.pytorch.org/whl/cpu"
#   explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring colmap/heavy deps",
]
